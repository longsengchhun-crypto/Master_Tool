[package]
publish = false
name = "sentrix-desktop"
version = "0.3.1"
edition = "2021"
description = "SENTRIX desktop application"
authors = ["SENTRIX"]
license = "UNLICENSED"

[lib]
name = "sentrix_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
sentrix-core = { path = "../../../services/scanner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
tauri-plugin-opener = "2.7.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
minisign = "0.7"
minisign-verify = "0.2"
