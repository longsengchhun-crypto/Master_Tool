[package]
publish = false
name = "sentrix-core"
version = "0.3.1"
edition = "2021"
description = "SENTRIX security engine: file identification, layered detection, verdicts, quarantine"
license = "UNLICENSED"

[lib]
name = "sentrix_core"
path = "src/lib.rs"

[[bin]]
name = "sentrix-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "sentrix-botd"
path = "src/bin/botd.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
goblin = "0.9"
zip = { version = "9", default-features = false, features = ["deflate"] }
cfb = "0.10"
notify = "8"
chacha20poly1305 = "0.10"
rand = "0.8"
memchr = "2"
# One fast multi-pattern pass for the attacker-technique rules.
aho-corasick = "1"
# Durable queue/outbox/event log. Bundled SQLite: no system dependency, same engine on every platform.
rusqlite = { version = "0.40", features = ["bundled"] }
# Telegram Bot API client (HTTPS).
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
libloading = { version = "0.8", default-features = false }
qrcode = { version = "0.14", default-features = false }
tiny_http = "0.12"
# Checks the signature on a downloaded bot update (the same scheme and key as the desktop app's updates).
minisign-verify = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_WinTrust",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_Security",
] }

[dev-dependencies]
tempfile = "3"
minisign = "0.7"
