# cargo-deny policy. ClamAV (GPL-2.0) is a separate process and is not a Rust dependency, so it is not covered here.
[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"
# zip 4.6.1 comes in through tauri-plugin-updater. The three advisories are about ZipArchive::extract() on Unix
# (symlink targets, SUID bits). SENTRIX ships a Windows NSIS installer as the update artifact, so the updater never
# extracts a zip, and the artifact's minisign signature is verified before anything is read. Revisit when the
# updater plugin moves to zip >= 9.
ignore = ["RUSTSEC-2026-0367", "RUSTSEC-2026-0368", "RUSTSEC-2026-0369"]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016",
  "Zlib", "MPL-2.0", "CC0-1.0", "0BSD", "BSL-1.0", "CDLA-Permissive-2.0", "OpenSSL", "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
